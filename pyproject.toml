[project]
name = "serendipity-webui"
version = "0.1.0"
description = "Standalone web interface for the Serendipity AI agent platform"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
]

[tool.ruff]
target-version = "py312"
line-length = 120
